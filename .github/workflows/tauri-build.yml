name: Tauri Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'src-tauri/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tauri-build.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          # macos-latest is intentionally excluded — the `challenge_response`
          # crate (Yubikey support) doesn't compile against the version of
          # `nusb` that macOS resolves to (`DeviceInfo::busnum` is missing).
          # We don't ship macOS bundles from this workflow anyway; the
          # release workflow stopped doing it once bundle_dmg.sh broke
          # upstream. Re-add when challenge_response or nusb fixes things.
    
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Install dependencies
      run: npm ci

    - name: Build Tauri App
      env:
        # Updater bundles need to be signed even in CI dry-runs so the
        # build command doesn't bail at the "no private key" check.
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      run: npm run tauri:build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tauri-app-${{ matrix.platform }}
        path: src-tauri/target/release/bundle/**/*
        retention-days: 7
