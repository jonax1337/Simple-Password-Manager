name: Create Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          # macos-latest currently fails inside bundle_dmg.sh on the runner
          # (Tauri 2 + GH macos-latest known issue). Re-add when fixed.
    
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: './src-tauri -> target'

    - name: Install dependencies
      run: npm ci

    - name: Build Tauri App
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: npm run tauri:build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tauri-app-${{ matrix.platform }}
        path: src-tauri/target/release/bundle/**/*
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: v$VERSION"
      
      - name: Check if release exists
        id: check_release
        run: |
          if gh release view ${{ steps.version.outputs.version }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.version }} exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.version }} does not exist"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Delete existing release
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "Deleting existing release ${{ steps.version.outputs.version }}"
          gh release delete ${{ steps.version.outputs.version }} --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-app-windows
          path: ./artifacts/windows
      
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-app-linux
          path: ./artifacts/linux
      
      # macOS artifact step removed while bundle_dmg.sh is broken upstream.

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -R ./artifacts
      
      - name: Create GitHub Release
        run: |
          # Upload installers (.exe/.msi/.deb/.AppImage/.dmg/.rpm) and the .sig
          # signature files the updater plugin needs to verify downloads.
          find ./artifacts -type f \( \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.dmg" -o \
            -name "*.rpm" -o \
            -name "*.sig" \
          \) -print0 | xargs -0 -I {} echo "{}"

          find ./artifacts -type f \( \
            -name "*.msi" -o \
            -name "*.exe" -o \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.dmg" -o \
            -name "*.rpm" -o \
            -name "*.sig" \
          \) -print0 | xargs -0 gh release create ${{ steps.version.outputs.version }} \
            --title "Password Manager ${{ steps.version.outputs.version }}" \
            --notes "Release ${{ steps.version.outputs.version }}" \
            --draft=false \
            --prerelease=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build updater manifest (latest.json)
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NUM="${VERSION#v}"
          REPO="${GITHUB_REPOSITORY}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          win_exe=$(find ./artifacts/windows -type f -name "*-setup.exe" | head -n1)
          win_sig=$(find ./artifacts/windows -type f -name "*-setup.exe.sig" | head -n1)

          if [ -z "$win_exe" ] || [ -z "$win_sig" ]; then
            echo "Could not locate signed Windows installer + .sig; skipping latest.json" >&2
            exit 0
          fi

          win_signature=$(cat "$win_sig")
          # GitHub stores release assets with spaces normalised to dots
          # (e.g. "Simple Password Manager_1.2.0_x64-setup.exe" becomes
          # "Simple.Password.Manager_1.2.0_x64-setup.exe"). Use the actual
          # asset name from the release rather than the basename of the
          # local file, otherwise the updater download 404s.
          win_asset=$(gh release view "$VERSION" --json assets \
            --jq '.assets[].name' | grep -E '_x64-setup\.exe$' | head -n1)
          if [ -z "$win_asset" ]; then
            echo "Could not find x64-setup.exe asset on release $VERSION" >&2
            exit 1
          fi
          win_url="https://github.com/$REPO/releases/download/$VERSION/$win_asset"

          cat > latest.json <<EOF
          {
            "version": "$VERSION_NUM",
            "notes": "See the GitHub release for details.",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$win_signature",
                "url": "$win_url"
              }
            }
          }
          EOF

          gh release upload "$VERSION" latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
