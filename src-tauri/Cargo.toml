[package]
name = "simple-password-manager"
version = "2.0.0"
description = "A simple and secure password manager"
authors = ["Jonas Laux"]
edition = "2021"
default-run = "simple-password-manager"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keepass = { version = "0.13.6", features = ["save_kdbx4", "challenge_response"] }
chrono = "0.4"
rust-argon2 = "3.0"
secrecy = "0.10"
rand = "0.9"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
sha1 = "0.11"
hmac = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
notify = "8"
hostname = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
zeroize = "1"
sha2 = "0.10"
# Renamed to dodge a symbol collision with `rust-argon2` (used by the kdbx
# layer). They expose different APIs; we want this one for our Argon2id KDF
# in cloud/crypto.rs.
argon2-pure = { package = "argon2", version = "0.5" }
crypto_box = { version = "0.9", features = ["std", "chacha20"] }

# Windows Hello via Credential Manager + UserConsentVerifier. Only
# pulled in on Windows; the lib stays cross-platform. Other targets
# get stub commands that report Hello as unavailable.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_System_WinRT",
  "Security_Credentials_UI",
  "Foundation",
] }
# Needed to spell the return type of `IUserConsentVerifierInterop::
# RequestVerificationForWindowAsync<T>`, which is generic and can't be
# inferred without an explicit hint.
windows-future = "0.3"

[[bin]]
name = "simple-password-manager"
path = "src/main.rs"

[[bin]]
name = "browser-bridge-host"
path = "src/bin/browser_bridge_host.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
